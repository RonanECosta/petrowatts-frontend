<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Petrowatt</title>
</head>

<body>
    <header>
        <div class="title">
            <h2>Investimento e Economia: veículos elétricos x combustão</h2>
        </div>
        <div class="icon">
            <img src="./img/favicon.ico" alt="icon">
        </div>
    </header>

    <section class="cadastro">
        <h2>Cadastro inicial</h2>

        <div class="linha">
            <input class="campo-md" type="text" id="cpf" placeholder="CPF" pattern="\d*"
                maxlength="11"><!--apenas números-->
            <input class="campo-largo" type="text" id="nome" placeholder="Nome completo" maxlength="50">
            <select id="uf">
                <option class="campo-pp" value="" disabled selected>UF</option>
            </select>
        </div>
        <div class="linha">
            <h4>Carro (à combustão):</h4>
        </div>
        <div class="linha">

            <select class="campo-md" id="fabricante">
                <option value="" disabled selected>Fabricante</option>
            </select>
            <select class="campo-md" id="modelo" disabled>
                <option value="" disabled selected>Modelo</option>
            </select>
            <select class="campo-md" id="anoFabricacao" disabled>
                <option value="" disabled selected>Ano</option>
            </select>
            <input class="campo-p" type="number" id="rodagemMensal" placeholder="Km mensal">
        </div>
        <div class="linha">
            <button onclick="novoCadastro()" class="addBtn">Cadastrar</button>
            <button onclick="novaConsulta()" class="addBtn">Buscar</button>
            <button id="alterarBtn"  onclick="alterarCadastro()" class="alterBtn" disabled>Alterar</button>
            <button onclick="limpaFormulario()" class="addBtn">Limpar campos</button>
            <button id="irParaResultadoBtn" onclick="irParaResultados()" class="addBtn" disabled style="background-color: #28a745;">Ver Comparativo</button>
        </div>
    </section>

    <section class="errors">
        <div id="erroAno" class="erro-mensagem">O ano deve ser um número inteiro entre 2014 e 2026.</div>
    </section>

    <section class="dados">
        <div id="dadosCadastrados" class="card-resultado">
            <h3>Seus Dados Cadastrados</h3>
            <p><strong>Id:</strong> <span id="resId">-</span></p>
            <p><strong>Nome:</strong> <span id="resNome">-</span></p>
            <p><strong>UF:</strong> <span id="resUf">-</span></p>

            <h3>Dados do Veículo</h3>
            <p><strong>Fabricante:</strong> <span id="resFabricante">-</span></p>
            <p><strong>Modelo:</strong> <span id="resModelo">-</span></p>
            <p><strong>Ano:</strong> <span id="resAno">-</span></p>
            <p><strong>Rodagem Mensal:</strong> <span id="resKm">-</span> km</p>
        </div>
        <div class="linha">
            <button id="deleteBtn" onclick="deleteCadastro()" class="delBtn" disabled>Exclusão</button>
        </div>
    </section>

    <section class="avancar-dashboard">
        <button id="irParaDashboardBtn" onclick="irParaDashboard()" class="addBtn" disabled>Ir para Dashboard</button>
        <script>
            document.getElementById('irParaDashboardBtn').disabled = false;
        </script>
    </section>

    <script src="scripts.js"></script>
</body>

</html>
